<!----><div class="portfolio-composition"><!--?lit$797237161$--><div class="desktop"><!--?lit$797237161$--><div class="portfolio-composition__container"><h2 class="c11n-space-stack-5x c11n-text-3xl-headline">Portfolio composition</h2><!--?lit$797237161$--> <!--?lit$797237161$--><div class="characteristics-asset-allocation-wrapper"><div class="characteristics-container c11n-space-stack-6x"><!--?lit$797237161$--><div><fds-characteristics fundcategoryid=""></fds-characteristics></div></div><!--?lit$797237161$--> <!--?lit$797237161$--><div class="stylebox-section"><h3 class="c11n-text-lg-headline c11n-space-stack-2x">Stylebox</h3><fds-portfolio-stylebox></fds-portfolio-stylebox></div></div><!--?lit$797237161$--> <!--?lit$797237161$--><div class="c11n-space-stack-6x risk-banner"><fds-info-text-block variant="banner" backgroundcolor="light-green" backgroundimage="No Image" label="&lt;p&gt;Risks associated with conservative funds&lt;/p&gt;" value="&lt;p&gt;Vanguard funds are classified as conservative if their share prices are expected to remain stable or to fluctuate only slightly. Keep in mind that investments that offer stability of principal typically are the most vulnerable to income risk—the possibility that the income from the investment will fluctuate over brief periods—and tend to produce lower long-term returns than riskier assets. Such funds are appropriate for the short-term reserves portion of a long-term investment portfolio, for investors with short-term investment horizons (no longer than three years), and for investors whose tolerance for share-price fluctuations is very low or whose employment or financial situation is precarious.&lt;/p&gt;"></fds-info-text-block></div><fds-weighted-exposure></fds-weighted-exposure><!--?lit$797237161$--><fds-holding-details></fds-holding-details> <!--?lit$797237161$--> <!--?lit$797237161$--></div></div></div>
